name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-docs.txt
      - run: pip install -r requirements-dev.txt -r requirements-docs.txt
      - name: lint
        # `check` is the narrow rule set CI has always run. `format --check` is new: the
        # pre-commit hook auto-formats staged files, so without this check a file that is
        # never staged can drift indefinitely, and drift lands in unrelated PRs the first
        # time somebody touches it.
        run: |
          ruff check tools tests
          ruff format --check tools tests
      - name: pytest
        run: python -m pytest tests -q
      - name: docs build
        run: zensical build --clean
