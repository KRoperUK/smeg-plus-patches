name: Link check

# External links rot quietly; `zensical build --strict` only checks internal anchors. This
# runs weekly and keeps ONE open issue up to date instead of failing anybody's PR (#200).
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --exclude-mail --max-retries 2 --accept 200,206,429
            './docs/**/*.md' README.md CONTRIBUTING.md AGENTS.md
          output: ./lychee/out.md
          fail: false
      - name: find the open link-check issue
        id: existing
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "docs: broken external links"' --json number -q '.[0].number')
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - name: open or update the issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "docs: broken external links"
          content-filepath: ./lychee/out.md
          labels: documentation
          issue-number: ${{ steps.existing.outputs.number }}
