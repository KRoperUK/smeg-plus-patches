# Two gates, deliberately split by cost.
#
#   pre-commit  fast enough to run on every commit: hygiene, lint, and the one check that
#               must never be skipped — no vendor firmware in the tree.
#   pre-push    what CI would tell you twenty minutes later: the tests, a strict docs build,
#               and a security scan. A push that would go red should fail here instead.
#
# Install both (and the commit-msg hook) with `pre-commit install --install-hooks`;
# `default_install_hook_types` below means a bare `pre-commit install` wires all three.
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]   # no firmware or packages in the repo, ever
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # --- pre-push: the slow ones -------------------------------------------------------
  #
  # These run in pre-commit's own isolated environments (`language: python`), not through
  # `sh -c` with a hard-coded `.venv/bin/python`: the old form assumed a POSIX shell and a
  # Unix venv layout, so on Windows the hooks never ran. The pins below mirror
  # requirements-dev.txt / requirements-docs.txt — keep them in sync.

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: security scan (bandit)
        stages: [pre-push]
        args: ["-q", "-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/          # asserts are the point of a test file

  - repo: local
    hooks:
      - id: pytest
        name: tests
        entry: pytest -q
        language: python
        additional_dependencies: ["pytest>=8", "unicorn>=2.0", "capstone>=5.0"]
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: docs-strict
        name: docs build (strict)
        entry: zensical build --strict
        language: python
        additional_dependencies: ["zensical==0.0.73"]
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: no-firmware
        name: no vendor firmware staged
        entry: tools/check_no_firmware.sh
        language: system
        always_run: true
        pass_filenames: false

      - id: no-pii
        name: no personal data
        entry: tools/check_no_pii.py
        language: script
        types: [text]

      - id: conventional-commit
        name: conventional commit message
        entry: tools/check_commit_msg.py
        language: script
        stages: [commit-msg]
